services:
  postgres:
    image: postgres:16-alpine
    container_name: noosphere-postgres
    environment:
      POSTGRES_USER: noosphere
      POSTGRES_PASSWORD: noosphere
      POSTGRES_DB: noosphere
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noosphere -d noosphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  noosphere:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noosphere-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://noosphere:noosphere@postgres:5432/noosphere
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./prompts:/app/prompts:ro
      - ./outputs:/app/outputs
      - noosphere_data:/app/data
    command: ["mcp"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  noosphere_data:
