services:
  postgres:
    image: postgres:16-alpine
    container_name: noosphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: noosphere
      POSTGRES_PASSWORD: ${NOOSPHERE_DATABASE_PASSWORD:?Set NOOSPHERE_DATABASE_PASSWORD before starting the database}
      POSTGRES_DB: noosphere
    volumes:
      - ${NOOSPHERE_DATA_DIR:-./.noosphere}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noosphere -d noosphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  noosphere:
    # Pre-built images are available at ghcr.io/boriszhangyyy/noosphere
    # To pull instead of building: remove the `build:` block and uncomment:
    #   image: ghcr.io/boriszhangyyy/noosphere:latest
    image: noosphere:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noosphere-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://noosphere:${NOOSPHERE_DATABASE_PASSWORD:?Set NOOSPHERE_DATABASE_PASSWORD}@postgres:5432/noosphere
      NOOSPHERE_ACCESS_TOKEN: ${NOOSPHERE_ACCESS_TOKEN:?Set NOOSPHERE_ACCESS_TOKEN before starting the service}
      NOOSPHERE_HOME: /data
      NOOSPHERE_CONFIG: /data/config.json
      NOOSPHERE_OUTPUT_DIR: /data/articles
      NOOSPHERE_CHECKPOINT_BACKEND: postgres
    ports:
      - "${NOOSPHERE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - ${NOOSPHERE_DATA_DIR:-./.noosphere}:/data
    command: ["mcp"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
